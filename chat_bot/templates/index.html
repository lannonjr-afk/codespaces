<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AURA</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; background: #111827; color: #f3f4f6; }
      h1 { margin-bottom: .25rem; }
      #conversation { display: grid; gap: 1rem; margin: 2rem 0; }
      .message { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; border-radius: .75rem; background: #1f2937; }
      .user { background: #263650; }
      form { display: grid; gap: .75rem; }
      textarea { box-sizing: border-box; width: 100%; min-height: 6rem; padding: .75rem; border: 1px solid #4b5563; border-radius: .5rem; background: #1f2937; color: inherit; font: inherit; }
      button { justify-self: end; padding: .65rem 1.2rem; border: 0; border-radius: .5rem; background: #2563eb; color: white; font: inherit; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 1.5em; color: #fca5a5; }
      #status.working { color: #93c5fd; }
      #offline { color: #fbbf24; }
    </style>
  </head>
  <body>
    <h1>AURA</h1>
    <p>Your assistant. Messages and replies are stored by this service. Do not submit sensitive information.</p>
    <p id="offline" role="status" hidden>You are offline. The app shell is available, but chat requires a connection.</p>
    <main id="conversation" aria-live="polite"></main>
    <form id="chat-form">
      <label for="message">Message</label>
      <textarea id="message" name="message" required maxlength="200000"></textarea>
      <p id="status" role="status" aria-live="polite"></p>
      <button type="submit">Send</button>
    </form>
    <script>
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message");
      const conversation = document.querySelector("#conversation");
      const status = document.querySelector("#status");
      const offline = document.querySelector("#offline");
      const button = form.querySelector("button");

      function updateOnlineStatus() {
        offline.hidden = navigator.onLine;
      }
      updateOnlineStatus();
      window.addEventListener("online", updateOnlineStatus);
      window.addEventListener("offline", updateOnlineStatus);

      function addMessage(role, text) {
        const item = document.createElement("section");
        item.className = `message ${role}`;
        item.textContent = `${role === "user" ? "You" : "AURA"}: ${text}`;
        conversation.append(item);
      }

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (button.disabled) return;
        const message = input.value.trim();
        if (!message) return;

        button.disabled = true;
        status.textContent = "Thinking…";
        status.classList.add("working");
        addMessage("user", message);
        input.value = "";

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ message }),
          });
          const contentType = response.headers.get("content-type") || "";
          const result = contentType.includes("application/json")
            ? await response.json()
            : {};
          if (!response.ok) throw new Error(result.error || `Request failed (${response.status}).`);
          if (typeof result.response !== "string") throw new Error("The server returned an invalid response.");
          addMessage("assistant", result.response);
          status.textContent = "";
        } catch (error) {
          status.textContent = error instanceof TypeError
            ? "Could not reach the chat service. Check your connection and try again."
            : error.message;
        } finally {
          status.classList.remove("working");
          button.disabled = false;
          input.focus();
        }
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/static/sw.js").catch(() => {
            // Chat remains usable if service worker registration is unavailable.
          });
        });
      }
    </script>
  </body>
</html>
